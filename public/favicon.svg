<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Outer circle -->
  <circle cx="16" cy="16" r="15" fill="#1F3369"/>
  <!-- Clock face -->
  <circle cx="16" cy="16" r="12" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Hour ticks -->
  <line x1="16" y1="5"  x2="16" y2="7"  stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="25" x2="16" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5"  y1="16" x2="7"  y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="16" x2="27" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hour hand (pointing ~10 o'clock) -->
  <line x1="16" y1="16" x2="11" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (pointing ~2 o'clock) -->
  <line x1="16" y1="16" x2="22" y2="11" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.8" fill="#4CAF50"/>
</svg>
